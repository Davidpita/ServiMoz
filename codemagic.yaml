
workflows:
  ios-simulator:
    name: ServiMoz Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Gerar projeto Xcode
        script: |
          xcodegen generate --spec project.yaml

      - name: Compilar e diagnosticar
        script: |
          set -e

          echo "=== Ficheiros Swift ==="
          find ServiMoz -name "*.swift" -print

          echo "=== Targets e schemes ==="
          xcodebuild -list -project ServiMoz.xcodeproj

          echo "=== Configuracoes importantes ==="
          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -configuration Release \
            -sdk iphonesimulator \
            -showBuildSettings | grep -E \
            "PRODUCT_TYPE =|EXECUTABLE_NAME =|MACH_O_TYPE =|SKIP_INSTALL =|SWIFT_VERSION ="

          echo "=== Compilacao ==="
          set -o pipefail

          xcodebuild \
            -project ServiMoz.xcodeproj \
            -target ServiMoz \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-log.txt

          echo "=== Etapas de compilacao Swift ==="
          grep -E "SwiftCompile|SwiftDriver|CompileSwift|Ld " \
            build-log.txt || true

          echo "=== Conteudo da app ==="
          ls -la build/Build/Products/Release-iphonesimulator/ServiMoz.app

      - name: Verificar executavel
        script: |
          set -e

          APP="build/Build/Products/Release-iphonesimulator/ServiMoz.app"

          echo "=== Conteudo da app ==="
          ls -la "$APP"

          EXEC=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist")

          echo "Executavel esperado: $EXEC"

          if [ ! -f "$APP/$EXEC" ]; then
            echo "ERRO: Executavel ausente!"
            find build/Build/Products -maxdepth 5 -print
            exit 1
          fi

          file "$APP/$EXEC"

          echo "Executavel encontrado!"

      - name: Criar ZIP para Appetize
        script: |
          cd build/Build/Products/Release-iphonesimulator

          ditto -c -k --sequesterRsrc --keepParent \
            ServiMoz.app \
            "$CM_BUILD_DIR/ServiMoz.zip"

    artifacts:
      - ServiMoz.zip
