
workflows:
  ios-simulator:
    name: ServiMoz Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Gerar projeto Xcode
        script: |
          xcodegen generate --spec project.yaml

      - name: Compilar para o simulador
        script: |
          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verificar aplicação
        script: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/ServiMoz.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERRO: ServiMoz.app nao encontrado"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          echo "Executavel esperado: $EXECUTABLE"

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERRO: Executavel nao encontrado"
            ls -la "$APP_PATH"
            exit 1
          fi

          echo "Aplicacao validada com sucesso!"

      - name: Criar ZIP para Appetize
        script: |
          cd build/Build/Products/Debug-iphonesimulator

          ditto -c -k --sequesterRsrc --keepParent \
            ServiMoz.app \
            "$CM_BUILD_DIR/ServiMoz.zip"

    artifacts:
      - ServiMoz.zip
