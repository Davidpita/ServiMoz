
workflows:
  ios-simulator:
    name: ServiMoz Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Gerar projeto Xcode
        script: |
          xcodegen generate --spec project.yaml

      - name: Compilar para simulador
        script: |
          set -e

          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verificar executavel
        script: |
          set -e

          APP="build/Build/Products/Release-iphonesimulator/ServiMoz.app"

          echo "=== Conteudo da app ==="
          ls -la "$APP"

          EXEC=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist")

          echo "Executavel esperado: $EXEC"

          if [ ! -f "$APP/$EXEC" ]; then
            echo "ERRO: Executavel ausente!"
            find build/Build/Products -maxdepth 5 -print
            exit 1
          fi

          file "$APP/$EXEC"

          echo "Executavel encontrado!"

      - name: Criar ZIP para Appetize
        script: |
          cd build/Build/Products/Release-iphonesimulator

          ditto -c -k --sequesterRsrc --keepParent \
            ServiMoz.app \
            "$CM_BUILD_DIR/ServiMoz.zip"

    artifacts:
      - ServiMoz.zip
