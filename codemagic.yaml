
workflows:
  ios-simulator:
    name: ServiMoz Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Gerar projeto Xcode
        script: |
          xcodegen generate --spec project.yaml

      - name: Compilar e diagnosticar
        script: |
          set -e
          set -o pipefail

          echo "=== Ficheiros Swift ==="
          find ServiMoz -name "*.swift" -print

          echo "=== Verificar ficheiros no projecto Xcode ==="
          grep -c "in Sources" \
            ServiMoz.xcodeproj/project.pbxproj || true

          echo "=== Configuracoes do executavel ==="
          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -configuration Release \
            -sdk iphonesimulator \
            -showBuildSettings | grep -E \
            "EXECUTABLE_NAME =|PRODUCT_TYPE =|MACH_O_TYPE =|GENERATE_INFOPLIST_FILE =|SWIFT_VERSION ="

          echo "=== Compilar aplicacao ==="
          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-log.txt

          echo "=== Compilacao e ligacao ==="
          grep -E \
            "SwiftCompile|SwiftDriver|SwiftEmitModule|Ld |BUILD SUCCEEDED|BUILD FAILED" \
            build-log.txt || true

          echo "=== Conteudo da aplicacao ==="
          ls -la \
            build/Build/Products/Release-iphonesimulator/ServiMoz.app

      - name: Verificar executavel
        script: |
          set -e

          APP="build/Build/Products/Release-iphonesimulator/ServiMoz.app"

          echo "=== Conteudo da app ==="
          ls -la "$APP"

          EXEC=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist")

          echo "Executavel esperado: $EXEC"

          if [ ! -f "$APP/$EXEC" ]; then
            echo "ERRO: Executavel ausente!"
            find build/Build/Products -maxdepth 5 -print
            exit 1
          fi

          file "$APP/$EXEC"

          echo "Executavel encontrado!"

      - name: Criar ZIP para Appetize
        script: |
          cd build/Build/Products/Release-iphonesimulator

          ditto -c -k --sequesterRsrc --keepParent \
            ServiMoz.app \
            "$CM_BUILD_DIR/ServiMoz.zip"

    artifacts:
      - ServiMoz.zip
